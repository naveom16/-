<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบสำรวจข้อมูลไมโครโฟนไร้สาย</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: #f5f5f5;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        
        .tab:hover {
            background: #e8e8e8;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-section {
            display: none;
        }
        
        .form-section.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        label .required {
            color: #e74c3c;
            margin-left: 5px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-success {
            background: #27ae60;
            color: white;
        }
        
        .btn-success:hover {
            background: #229954;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .data-list {
            margin-top: 20px;
        }
        
        .data-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        
        .data-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .data-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .data-item-title {
            font-weight: 600;
            color: #333;
        }
        
        .data-item-number {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        
        .data-item-details {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .data-item-details div {
            margin-bottom: 3px;
        }
        
        .data-item-actions {
            margin-top: 10px;
            display: flex;
            gap: 5px;
        }
        
        .data-item-actions button {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.3;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            display: none;
            max-width: 400px;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .notification.success {
            background: #27ae60;
            display: block;
        }
        
        .notification.error {
            background: #e74c3c;
            display: block;
        }
        
        .other-org-input {
            margin-top: 10px;
            display: none;
        }
        
        .other-org-input.active {
            display: block;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }
            
            .content {
                padding: 20px;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
            
            .tabs {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>แบบสำรวจข้อมูลการใช้งานคลื่นความถี่ไมโครโฟนไร้สาย</h1>
            <p>กรุณากรอกข้อมูลไมโครโฟนไร้สายของหน่วยงานท่าน<br>
            เพื่อใช้ในการรวบรวมฐานข้อมูลและวางแผนการบริหารจัดการคลื่นความถี่<br>
            <strong>Contact:</strong> library@nrru.ac.th</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('form')">กรอกข้อมูล</button>
            <button class="tab" onclick="showTab('list')">รายการข้อมูล (<span id="count">0</span>)</button>
        </div>
        
        <div class="content">
            <!-- Form Section -->
            <div id="form-section" class="form-section active">
                <form id="micForm">
                    <div class="form-group">
                        <label>ชื่อหน่วยงาน / คณะ / สำนัก <span class="required">*</span></label>
                        <select id="organization" required onchange="handleOrgChange()">
                            <option value="">-- กรุณาเลือกหน่วยงาน --</option>
                            <option value="คณะครุศาสตร์">คณะครุศาสตร์</option>
                            <option value="คณะมนุษยศาสตร์และสังคมศาสตร์">คณะมนุษยศาสตร์และสังคมศาสตร์</option>
                            <option value="คณะวิทยาศาสตร์และเทคโนโลยี">คณะวิทยาศาสตร์และเทคโนโลยี</option>
                            <option value="คณะวิทยาการจัดการ">คณะวิทยาการจัดการ</option>
                            <option value="คณะเทคโนโลยีอุตสาหกรรม">คณะเทคโนโลยีอุตสาหกรรม</option>
                            <option value="คณะสาธารณสุขศาสตร์">คณะสาธารณสุขศาสตร์</option>
                            <option value="คณะพยาบาลศาสตร์">คณะพยาบาลศาสตร์</option>
                            <option value="สำนักส่งเสริมวิชาการและงานทะเบียน">สำนักส่งเสริมวิชาการและงานทะเบียน</option>
                            <option value="สำนักวิทยบริการและเทคโนโลยีสารสนเทศ">สำนักวิทยบริการและเทคโนโลยีสารสนเทศ</option>
                            <option value="สถาบันวิจัยและพัฒนา">สถาบันวิจัยและพัฒนา</option>
                            <option value="สำนักศิลปะและวัฒนธรรม">สำนักศิลปะและวัฒนธรรม</option>
                            <option value="สถาบันวิจัยไม้กลายเป็นหินและทรัพยากรธรณี">สถาบันวิจัยไม้กลายเป็นหินและทรัพยากรธรณี</option>
                            <option value="สำนักคอมพิวเตอร์">สำนักคอมพิวเตอร์</option>
                            <option value="สถาบันภาษา">สถาบันภาษา</option>
                            <option value="สำนักการเรียนรู้ตลอดชีวิต">สำนักการเรียนรู้ตลอดชีวิต</option>
                            <option value="สำนักงานอธิการบดี">สำนักงานอธิการบดี</option>
                            <option value="โรงเรียนสาธิตมหาวิทยาลัยราชภัฏนครราชสีมา (ฝ่ายประถม)">โรงเรียนสาธิตมหาวิทยาลัยราชภัฏนครราชสีมา (ฝ่ายประถม)</option>
                            <option value="โรงเรียนสาธิตมหาวิทยาลัยราชภัฏนครราชสีมา (ฝ่ายมัธยม)">โรงเรียนสาธิตมหาวิทยาลัยราชภัฏนครราชสีมา (ฝ่ายมัธยม)</option>
                            <option value="ศูนย์การศึกษาพิเศษ">ศูนย์การศึกษาพิเศษ</option>
                            <option value="อื่นๆ">อื่นๆ / ศูนย์ , กอง</option>
                        </select>
                        <div class="other-org-input" id="otherOrgInput">
                            <input type="text" id="otherOrganization" placeholder="กรุณากรอกชื่อหน่วยงาน/ศูนย์/กอง">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>ชื่อ–นามสกุล ของผู้ให้ข้อมูล <span class="required">*</span></label>
                        <input type="text" id="contactName" required placeholder="ชื่อ นามสกุล">
                    </div>
                    
                    <div class="form-group">
                        <label>ยี่ห้อ (Brand) ของไมโครโฟนไร้สาย <span class="required">*</span></label>
                        <input type="text" id="brand" required placeholder="เช่น Shure, Sennheiser, Sony">
                    </div>
                    
                    <div class="form-group">
                        <label>รุ่น (Model) ของไมโครโฟนไร้สาย <span class="required">*</span></label>
                        <input type="text" id="model" required placeholder="เช่น SLX2/SM58">
                    </div>
                    
                    <div class="form-group">
                        <label>ปีที่จัดซื้อหรือปีที่เริ่มใช้งาน <span class="required">*</span></label>
                        <input type="number" id="year" required min="2000" max="2099" placeholder="เช่น 2023">
                    </div>
                    
                    <div class="form-group">
                        <label>หมายเลขคลื่นความถี่ที่ใช้งาน <span class="required">*</span></label>
                        <input type="text" id="frequency" required placeholder="เช่น 470.125 MHz">
                    </div>
                    
                    <div class="form-group">
                        <label>สถานที่ติดตั้งหรือสถานที่ใช้งาน <span class="required">*</span></label>
                        <input type="text" id="location" required placeholder="เช่น ห้องประชุมใหญ่ อาคาร 3">
                    </div>
                    
                    <div class="btn-group">
                        <button type="submit" class="btn-primary">บันทึกข้อมูล</button>
                        <button type="button" class="btn-secondary" onclick="clearForm()">ล้างข้อมูล</button>
                    </div>
                </form>
            </div>
            
            <!-- List Section -->
            <div id="list-section" class="form-section">
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" id="totalCount">0</div>
                        <div class="stat-label">รายการทั้งหมด</div>
                    </div>
                </div>
                
                <div class="data-list" id="dataList">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p>ยังไม่มีข้อมูล</p>
                    </div>
                </div>
                
                <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #e0e0e0;">
                    <button class="btn-success" onclick="syncToGoogleSheets()">ส่งข้อมูลไป Google Sheets</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>
    
    <script>
        // ============================================
        // Google Sheets Configuration
        // แก้ไขค่าตรงนี้เท่านั้น ไม่ต้องแสดงให้ user เห็น
        // ============================================
        const GOOGLE_SHEETS_API_KEY = 'YOUR_API_KEY_HERE';
        const GOOGLE_SHEET_URL = 'YOUR_SHEET_URL_HERE';
        // ============================================
        
        let dataList = JSON.parse(localStorage.getItem('micDataList')) || [];
        let sheetId = '';
        let editingId = null;
        
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-section').classList.add('active');
            
            if (tab === 'list') {
                renderDataList();
            }
        }
        
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification ' + type;
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }
        
        function extractSheetId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : null;
        }
        
        function handleOrgChange() {
            const orgSelect = document.getElementById('organization');
            const otherInput = document.getElementById('otherOrgInput');
            
            if (orgSelect.value === 'อื่นๆ') {
                otherInput.classList.add('active');
                document.getElementById('otherOrganization').required = true;
            } else {
                otherInput.classList.remove('active');
                document.getElementById('otherOrganization').required = false;
                document.getElementById('otherOrganization').value = '';
            }
        }
        
        document.getElementById('micForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let organization = document.getElementById('organization').value;
            if (organization === 'อื่นๆ') {
                organization = document.getElementById('otherOrganization').value.trim();
                if (!organization) {
                    showNotification('กรุณากรอกชื่อหน่วยงาน', 'error');
                    return;
                }
            }
            
            const data = {
                id: editingId || generateId(),
                organization: organization,
                contactName: document.getElementById('contactName').value.trim(),
                brand: document.getElementById('brand').value.trim(),
                model: document.getElementById('model').value.trim(),
                year: document.getElementById('year').value.trim(),
                frequency: document.getElementById('frequency').value.trim(),
                location: document.getElementById('location').value.trim(),
                createdAt: editingId ? (dataList.find(d => d.id === editingId)?.createdAt || new Date().toISOString()) : new Date().toISOString()
            };
            
            if (editingId) {
                const index = dataList.findIndex(d => d.id === editingId);
                if (index !== -1) {
                    dataList[index] = data;
                }
                editingId = null;
            } else {
                dataList.push(data);
            }
            
            localStorage.setItem('micDataList', JSON.stringify(dataList));
            
            showNotification(editingId ? 'แก้ไขข้อมูลเรียบร้อยแล้ว' : 'บันทึกข้อมูลเรียบร้อยแล้ว', 'success');
            clearForm();
            updateCount();
        });
        
        function clearForm() {
            document.getElementById('micForm').reset();
            document.getElementById('otherOrgInput').classList.remove('active');
            document.getElementById('otherOrganization').required = false;
            editingId = null;
        }
        
        function deleteItem(id) {
            if (confirm('คุณต้องการลบข้อมูลนี้ใช่หรือไม่?')) {
                dataList = dataList.filter(item => item.id !== id);
                localStorage.setItem('micDataList', JSON.stringify(dataList));
                renderDataList();
                updateCount();
                showNotification('ลบข้อมูลเรียบร้อยแล้ว', 'success');
            }
        }
        
        function editItem(id) {
            const item = dataList.find(d => d.id === id);
            if (item) {
                editingId = id;
                document.getElementById('organization').value = item.organization;
                document.getElementById('contactName').value = item.contactName;
                document.getElementById('brand').value = item.brand;
                document.getElementById('model').value = item.model;
                document.getElementById('year').value = item.year;
                document.getElementById('frequency').value = item.frequency;
                document.getElementById('location').value = item.location;
                
                if (['อื่นๆ / ศูนย์ , กอง'].includes(item.organization) || !item.organization.match(/^(คณะ|สำนัก|สถาบัน|ศูนย์|โรงเรียน|สำนักงาน)/)) {
                    document.getElementById('organization').value = 'อื่นๆ';
                    document.getElementById('otherOrganization').value = item.organization;
                    document.getElementById('otherOrgInput').classList.add('active');
                    document.getElementById('otherOrganization').required = true;
                }
                
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('form-section').classList.add('active');
                document.getElementById('list-section').classList.remove('active');
                document.querySelectorAll('.tab')[1].classList.remove('active');
                
                showNotification('กรุณาแก้ไขข้อมูลและบันทึกอีกครั้ง', 'success');
            }
        }
        
        function renderDataList() {
            const listContainer = document.getElementById('dataList');
            
            if (dataList.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p>ยังไม่มีข้อมูล</p>
                    </div>
                `;
            } else {
                listContainer.innerHTML = dataList.map((item, index) => `
                    <div class="data-item">
                        <div class="data-item-header">
                            <div class="data-item-title">${item.brand} ${item.model}</div>
                            <span class="data-item-number">#${index + 1}</span>
                        </div>
                        <div class="data-item-details">
                            <div><strong>หน่วยงาน:</strong> ${item.organization}</div>
                            <div><strong>ผู้ติดต่อ:</strong> ${item.contactName}</div>
                            <div><strong>ยี่ห้อ:</strong> ${item.brand}</div>
                            <div><strong>รุ่น:</strong> ${item.model}</div>
                            <div><strong>ปีที่จัดซื้อ:</strong> ${item.year}</div>
                            <div><strong>คลื่นความถี่:</strong> ${item.frequency}</div>
                            <div><strong>สถานที่ติดตั้ง:</strong> ${item.location}</div>
                        </div>
                        <div class="data-item-actions">
                            <button class="btn-secondary" onclick="editItem('${item.id}')">แก้ไข</button>
                            <button class="btn-danger" onclick="deleteItem('${item.id}')">ลบ</button>
                        </div>
                    </div>
                `).join('');
            }
            
            updateStats();
        }
        
        function updateCount() {
            document.getElementById('count').textContent = dataList.length;
        }
        
        function updateStats() {
            document.getElementById('totalCount').textContent = dataList.length;
        }
        
        async function syncToGoogleSheets() {
            if (!GOOGLE_SHEETS_API_KEY || GOOGLE_SHEETS_API_KEY === 'YOUR_API_KEY_HERE') {
                showNotification('กรุณาตั้งค่า Google Sheets API Key ในโค้ดก่อน', 'error');
                return;
            }
            
            if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL === 'YOUR_SHEET_URL_HERE') {
                showNotification('กรุณาตั้งค่า Google Sheet URL ในโค้ดก่อน', 'error');
                return;
            }
            
            sheetId = extractSheetId(GOOGLE_SHEET_URL);
            if (!sheetId) {
                showNotification('รูปแบบ Google Sheets URL ไม่ถูกต้อง', 'error');
                return;
            }
            
            if (dataList.length === 0) {
                showNotification('ไม่มีข้อมูลให้ส่งออก', 'error');
                return;
            }
            
            try {
                showNotification('กำลังส่งข้อมูลไป Google Sheets...', 'success');
                
                const sheetName = 'Sheet1';
                
                const values = [
                    ['หน่วยงาน', 'ผู้ติดต่อ', 'ยี่ห้อ', 'รุ่น', 'ปีที่จัดซื้อ', 'คลื่นความถี่', 'สถานที่ติดตั้ง', 'วันที่บันทึก'],
                    ...dataList.map(item => [
                        item.organization,
                        item.contactName,
                        item.brand,
                        item.model,
                        item.year,
                        item.frequency,
                        item.location,
                        new Date(item.createdAt).toLocaleDateString('th-TH')
                    ])
                ];
                
                const response = await fetch(
                    `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent(sheetName)}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS&key=${GOOGLE_SHEETS_API_KEY}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            values: values
                        })
                    }
                );
                
                if (response.ok) {
                    const result = await response.json();
                    showNotification(`ส่งข้อมูล ${dataList.length} รายการสำเร็จ! อัปเดต ${result.updates.updatedRows} แถว`, 'success');
                } else {
                    const error = await response.json();
                    showNotification('ส่งข้อมูลไม่สำเร็จ: ' + (error.error.message || 'Unknown error'), 'error');
                }
            } catch (error) {
                showNotification('เกิดข้อผิดพลาด: ' + error.message, 'error');
            }
        }
        
        updateCount();
    </script>
</body>
</html>
